<!DOCTYPE html>
<html>
  <head>
    <title>Contact Form</title>
  </head>
  <body>
    <form name="blogPost" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" required />
      <input type="email" name="email" required />
      <input type="tel" name="phone" pattern="^\+[1-9][0-9\s().-]{7,19}$" required />
      <input type="text" name="venue" />
      <input type="text" name="locale" />
      <input type="text" name="sourcePage" />
    </form>
    <form name="contactPage" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" required />
      <input type="email" name="email" required />
      <input type="tel" name="phone" pattern="^\+[1-9][0-9\s().-]{7,19}$" required />
      <input type="text" name="message" />
    </form>
    <form name="individualVenueForm" netlify netlify-honeypot="bot-field" hidden>

      <input type="tel" name="phone" pattern="^\+[1-9][0-9\s().-]{7,19}$" required />
      <input type="text" name="venue" />
      <input type="text" name="eventType" required />
      <input type="text" name="estimatedDate" required />
      <input type="text" name="groupSize" required />
      <input type="text" name="message" required />
      <input type="text" name="venueTitle" />
      <input type="text" name="locale" />
      <input type="text" name="sourcePage" />

    <form name="popUpForm" netlify netlify-honeypot="bot-field" hidden>

      <input type="text" name="name" required />
      <input type="email" name="email" required />
      <input type="tel" name="phone" pattern="^\+[1-9][0-9\s().-]{7,19}$" required />
      <input type="text" name="eventType" />
      <input type="text" name="estimatedDate" />
      <input type="text" name="venueOfInterest" />

    <form name="inspectionForm" netlify netlify-honeypot="bot-field" hidden>

      <input type="text" name="venueLocation" />
      <input type="text" name="message" />

      <input type="text" name="referrer" />

      <input type="text" name="utm_campaign" />
      <input type="text" name="utm_term" />
      <input type="text" name="utm_content" />
