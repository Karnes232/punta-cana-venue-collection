[build]
  publish = ".next"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/blog/the-definitive-punta-cana-marriage-proposal-comparison-for-2026-2027"
  to = "https://sertuinevents.com/proposal/"
  status = 301
  force = true

[[redirects]]
  from = "/en/blog/the-definitive-punta-cana-marriage-proposal-comparison-for-2026-2027"
  to = "https://sertuinevents.com/proposal/"
  status = 301
  force = true

[[redirects]]
  from = "/es/blog/the-definitive-punta-cana-marriage-proposal-comparison-for-2026-2027"
  to = "https://sertuinevents.com/es/proposal/"
  status = 301
  force = true



[[headers]]
  for = "/__forms.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
